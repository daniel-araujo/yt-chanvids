[package]
name = "yt-chanvids"
description = "Lists a YouTube channel's videos or looks up channel/video details."
version = "1.4.0"
authors = ["Daniel Araujo <contact@daniel-araujo.pt>"]
repository = "https://github.com/daniel-araujo/yt-chanvids.git"
license = "GPL-3.0-or-later"
readme = "README.md"
edition = "2018"

[lib]
name = "yt_chanvids"
path = "src/lib.rs"

[[bin]]
name = "yt-chanvids"
path = "src/cli.rs"

[dependencies]

# HTTP requests.
attohttpc = { version = "0.30", features = ["json"] }

# Parsing command line.
getopts = "0.2"

# Parsing json, url query strings.
serde = "1.0"
serde_json = "1.0"
urlencoding = "2"

# Parsing pasted channel/video URLs.
url = "2"
